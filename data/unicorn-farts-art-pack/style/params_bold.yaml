# claude-artist style recipe for the unicorn farts art pack, BOLD variant:
# the same full-coverage cut-out pastel as params.yaml with much bigger,
# fewer strokes, stronger warm/cool hatching, heavier pastel-pencil edges and
# less blending, so the medium still shows at in-game scale (64 px/tile).
#   artist run <scene> --style data/unicorn-farts-art-pack/style/params_bold.yaml -o out/...

paper:
  color: "#6f6458"      # only used for the preview sheet; never shows inside the sprite
  tooth: pastel
  seed: 0
  texture: 0.0

render:
  ss: 2
  shadow_samples: 16
  sky_samples: 128

lines:
  crease_angle: 35
  corner_angle: 55
  smooth_sigma: 2.0

sketch:
  contour_passes: 1
  construction: false
  envelope: false

ink:
  hatch: {enabled: false}
  texture: false

values:
  levels: 4
  simplify: 7
  min_area: 120

colour:
  script: cool_shadows
  fallback_script: cool_shadows
  light_strength: 0.45
  halftone: 0.32
  support_key: 0.72
  max_pigments: 4

paint:
  medium: pastel
  coverage: full
  mass: {sigma: 0.011}                        # bigger, simpler value shapes
  broken: {value: 0.1, temperature: 0.09, scale: 0.06}
  edge: {aa: 0.6, fade: 0.011, alpha: 0.75}   # strokes run past the silhouette and thin out over ~8 px (concept scale)
  tooth: {grain: 0.55}
  sticks: {count: 18, neighbour: 0.45}        # fewer sticks, more neighbour swaps: the colour vibrates
  layers:
    - {name: block, kind: side, radius: 0.034, length: [3, 7], threshold: 0.0, blur: 1.0, grid: 1.1, bristles: 14, pressure: [0.5, 0.75], jitter: 1.2, hatch_mix: 0.5, vary: [6.0, 7.0]}
    - {name: form, kind: side, radius: 0.017, length: [2, 7], threshold: 0.07, blur: 0.8, grid: 1.0, bristles: 9, pressure: [0.6, 0.85], jitter: 0.9, hatch_mix: 0.35, vary: [4.5, 5.0]}
  blend: {strength: 0.35}
  hatch: {angle: 58, spacing: 0.011, width: 0.0042, length: [0.035, 0.075], groups: 0.5, per_group: [3, 5], pressure: [0.65, 0.9],
          push: {shadow: [-12.0, 4.0], light: [8.0, 1.0], value: 3.0}}
  detail: {name: detail, kind: tip, radius: 0.006, length: [2, 6], threshold: 0.15, blur: 0.6, grid: 1.0, bristles: 3, pressure: [0.7, 0.95], jitter: 0.5, hatch_mix: 0.0}
  highlights: {width: 0.005, length: [0.015, 0.035], density: 0.25}
  pencil:
    width: 0.003
    pressure: 1.0
    darken: 0.15
    light_loss: 0.25
    types: {silhouette: 1.3, contact: 1.0, crease: 0.75, material: 0.45, mark: 0.6}

finish:
  pencil: {opacity: 0.0}
  ink: {opacity: 0.0}
