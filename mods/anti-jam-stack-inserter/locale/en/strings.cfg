[mod-setting-description]
anti-jam-stack-inserter-mode=Smart swapping: built from and mined to stack inserters. Place them with an upgrade planner, blueprint, ghost or pipette; there's nothing extra to craft.\nDistinct item: its own item, crafted with the stack inserter's recipe.\nDistinct item with quick swap: as distinct item, plus quick recipes that turn a stack inserter into an anti-jam stack inserter and back, keeping its quality.\nCrafted upgrade: its own item, crafted from a stack inserter, a selector combinator and a processing unit.
anti-jam-stack-inserter-colour=Automatic: purple.
anti-jam-stack-inserter-long-colour=Automatic: aqua.
anti-jam-stack-inserter-lsi-colour=Recolours the long-handed stack inserter. Automatic and purple keep its own colours.
anti-jam-stack-inserter-yellow-hand=Keep the stack inserter's yellow hand and only recolour the platform and arm.
anti-jam-stack-inserter-long-yellow-hand=Keep the stack inserter's yellow hand and only recolour the platform and arm.
anti-jam-stack-inserter-lsi-yellow-hand=Keep its yellow hand. Turn off to recolour the hand too.
anti-jam-stack-inserter-bulk-upgrade=Makes the anti-jam stack inserter the bulk inserter's next upgrade, used by an upgrade planner with no rules set. Stack inserters still don't upgrade or downgrade.

[mod-setting-description-long-handed]
# Used instead of [mod-setting-description] when the Long Stack Inserter mod is installed (see settings.lua).
anti-jam-stack-inserter-mode=Smart swapping: built from and mined to stack inserters (and long-handed stack inserters). Place them with an upgrade planner, blueprint, ghost or pipette; there's nothing extra to craft.\nDistinct item: its own item, crafted with the stack inserter's recipe.\nDistinct item with quick swap: as distinct item, plus quick recipes that turn a stack inserter into an anti-jam stack inserter and back, keeping its quality.\nCrafted upgrade: its own item, crafted from a stack inserter, a selector combinator and a processing unit.
anti-jam-stack-inserter-colour=Automatic: black, since the long-handed stack inserter is purple. Without the Long Stack Inserter mod, automatic is purple.
anti-jam-stack-inserter-yellow-hand=Keep the stack inserter's yellow hand and only recolour the platform and arm, like the long-handed stack inserter. On by default while the Long Stack Inserter mod is installed.

