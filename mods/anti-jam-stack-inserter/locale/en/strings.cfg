[entity-description]
anti-jam-stack-inserter=A stack inserter that doesn't wait for a full hand. Stacks when it can, swings with a partial hand when no more matching items arrive.
long-anti-jam-stack-inserter=A long-handed stack inserter that doesn't wait for a full hand. Stacks when it can, swings with a partial hand when no more matching items arrive.

