[mod-setting-description]
anti-jam-stack-inserter-mode=Smart swapping: built from and mined to stack inserters (and long-handed stack inserters). Place them with an upgrade planner, blueprint, ghost or pipette; there's nothing extra to craft.\nDistinct item: its own item, crafted with the stack inserter's recipe.\nDistinct item with quick swap: as distinct item, plus quick recipes that turn a stack inserter into an anti-jam stack inserter and back, keeping its quality.
anti-jam-stack-inserter-colour=Automatic: purple, or black when the long-handed stack inserter mod is installed (it's purple too).
anti-jam-stack-inserter-long-colour=Automatic: aqua.
anti-jam-stack-inserter-lsi-colour=Recolours the long-handed stack inserter. Automatic and purple keep its own graphics.

