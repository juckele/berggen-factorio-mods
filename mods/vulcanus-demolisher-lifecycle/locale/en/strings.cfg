[mod-name]
vulcanus-demolisher-lifecycle=Vulcanus Demolisher Lifecycle

[mod-description]
vulcanus-demolisher-lifecycle=Allows demolishers to grow and spawn young.

[mod-setting-name]
demolisher-lifecycle-protect-starting-area=Demolishers cannot expand into the starting area
demolisher-lifecycle-expansion-interval-ticks=Expansion interval override (ticks)
demolisher-lifecycle-debug-log=Debug logging

[mod-setting-description]
demolisher-lifecycle-protect-starting-area=Demolisher territory cannot grow into the area Vulcanus starts without territory. Turning this on doesn't remove territory that has already grown there.
demolisher-lifecycle-expansion-interval-ticks=Ticks between demolisher territory expansions, each retaking one chunk of land cleared by killing demolishers. 60 ticks is one second. 0 uses the map's enemy expansion cooldowns, shortened by evolution like biter expansion.
demolisher-lifecycle-debug-log=Write the mod's decisions to factorio-current.log.
